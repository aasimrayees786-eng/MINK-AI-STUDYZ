name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Verifying Java Environment ==="
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          
          if [ -z "$JAVA_HOME" ]; then
            echo "::error::JAVA_HOME is not set!"
            exit 1
          fi

          JAVA_VER_STR=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          echo "Detected Java version string: $JAVA_VER_STR"
          
          if [ -z "$JAVA_VER_STR" ]; then
            echo "::error::Failed to detect Java version from 'java -version'."
            exit 1
          fi

          MAJOR_VER=$(echo "$JAVA_VER_STR" | cut -d'.' -f1)
          if [ "$MAJOR_VER" = "1" ]; then
            MAJOR_VER=$(echo "$JAVA_VER_STR" | cut -d'.' -f2)
          fi
          
          echo "Detected Java major version: $MAJOR_VER"
          if ! [[ "$MAJOR_VER" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not parse active Java major version: $MAJOR_VER"
            exit 1
          fi

          if [ "$MAJOR_VER" -lt 17 ]; then
            echo "::error::Active Java version ($MAJOR_VER) is lower than 17. Java 17 or newer is required."
            exit 1
          fi
          echo "Java environment verification passed (Java $MAJOR_VER)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          echo "=== Checking debug keystore ==="
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists."
          else
            echo "Generating temporary debug keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "::error::Failed to verify ./debug.keystore existence!"
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build debug APK
        run: |
          echo "=== Building Debug APK ==="
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify the APK
        run: |
          echo "=== Verifying Debug APK Output ==="
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "::error::Expected APK not found at $EXPECTED_APK"
            echo "Searching within app/build/outputs/apk for generated APK files:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 3 -type f -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "::error::APK file $EXPECTED_APK exists but is empty!"
            exit 1
          fi

          case "$EXPECTED_APK" in
            *.apk) ;;
            *)
              echo "::error::File $EXPECTED_APK does not have .apk extension!"
              exit 1
              ;;
          esac

          APK_SIZE=$(stat -c%s "$EXPECTED_APK" 2>/dev/null || stat -f%z "$EXPECTED_APK" 2>/dev/null)
          echo "Debug APK verified successfully: $EXPECTED_APK ($APK_SIZE bytes)"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prep_asset
        run: |
          echo "=== Preparing Release Asset ==="
          TMP_ASSET_DIR="${{ runner.temp }}/release_asset"
          mkdir -p "$TMP_ASSET_DIR"
          
          REPO_RAW="${{ github.event.repository.name }}"
          if [ -z "$REPO_RAW" ]; then
            REPO_RAW="${GITHUB_REPOSITORY#*/}"
          fi
          
          # Sanitize repository name: replace non-alphanumeric/dot/dash with hyphen
          REPO_CLEAN=$(echo "$REPO_RAW" | tr '[:upper:]' '[:lower:]' | sed -e 's/[^a-z0-9._-]/-/g' -e 's/--*/-/g' -e 's/^-//' -e 's/-$//')
          if [ -z "$REPO_CLEAN" ]; then
            REPO_CLEAN="android-app"
          fi
          
          RUN_NUM="${{ github.run_number }}"
          ASSET_NAME="${REPO_CLEAN}-debug-build-${RUN_NUM}.apk"
          ASSET_PATH="${TMP_ASSET_DIR}/${ASSET_NAME}"
          
          cp "app/build/outputs/apk/debug/app-debug.apk" "$ASSET_PATH"
          
          if [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Failed to prepare release asset at $ASSET_PATH"
            exit 1
          fi
          
          echo "Prepared release asset: $ASSET_PATH ($ASSET_NAME)"
          echo "asset_path=$ASSET_PATH" >> $GITHUB_OUTPUT
          echo "asset_name=$ASSET_NAME" >> $GITHUB_OUTPUT

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Publishing APK to GitHub Releases ==="
          gh --version
          
          ASSET_PATH="${{ steps.prep_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prep_asset.outputs.asset_name }}"
          
          if [ -z "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Release asset is missing or empty at '$ASSET_PATH'!"
            exit 1
          fi
          
          case "$ASSET_PATH" in
            *.apk) ;;
            *)
              echo "::error::Release asset does not have .apk extension!"
              exit 1
              ;;
          esac
          
          RUN_NUM="${{ github.run_number }}"
          RUN_ATTEMPT="${{ github.run_attempt }}"
          RELEASE_TAG="debug-apk-build-${RUN_NUM}-${RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${RUN_NUM}"
          
          cat << 'EOF' > release_notes.md
          ### 📱 Automated Debug APK Build

          This is an automatically generated debug APK built by GitHub Actions.

          - **Build / Run Number**: #${{ github.run_number }}
          - **Run Attempt**: ${{ github.run_attempt }}
          - **Source Commit SHA**: `${{ github.sha }}`
          - **Release Asset**: `${{ steps.prep_asset.outputs.asset_name }}`

          > ⚠️ **Notice**: This APK is intended for testing and development purposes. It is signed only with a temporary debug keystore and is not a Play Store production release.
          EOF

          echo "Creating release with tag: $RELEASE_TAG"
          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes-file release_notes.md \
            --target "${{ github.sha }}" \
            --latest

          rm -f release_notes.md
          echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Build & Release Summary ==="
          RELEASE_OUTCOME="${{ steps.publish_release.outcome }}"
          RUN_NUM="${{ github.run_number }}"
          RUN_ATTEMPT="${{ github.run_attempt }}"
          RELEASE_TAG="debug-apk-build-${RUN_NUM}-${RUN_ATTEMPT}"
          ASSET_NAME="${{ steps.prep_asset.outputs.asset_name }}"
          
          if [ "$RELEASE_OUTCOME" = "success" ]; then
            echo "GitHub Release published successfully!"
            RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url -q .url 2>/dev/null || echo "https://github.com/${{ github.repository }}/releases/tag/${RELEASE_TAG}")
            
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: Debug APK Build #${RUN_NUM}"
            echo "Release URL: $RELEASE_URL"
            echo "Asset Filename: $ASSET_NAME"
            
            cat << EOF >> $GITHUB_STEP_SUMMARY
          ## 🚀 Debug APK Build & Release Succeeded!

          ### 📦 Download Links
          - **GitHub Release Page**: [$RELEASE_TITLE]($RELEASE_URL)
          - **Direct Release Asset**: Download **\`$ASSET_NAME\`** directly under the **Assets** section of the [Release Page]($RELEASE_URL).
          - **GitHub Actions Artifact**: The build artifact **\`app-debug-apk\`** is also available on this workflow run page as a backup.

          ### 📋 Build Details
          - **Release Tag**: \`$RELEASE_TAG\`
          - **Run Number**: #$RUN_NUM (Attempt $RUN_ATTEMPT)
          - **Commit**: \`${{ github.sha }}\`
          EOF
          else
            echo "::warning::GitHub Release publishing was skipped or failed. Outcome: $RELEASE_OUTCOME"
            echo "The debug APK was built successfully and is preserved as an Actions artifact."
            
            cat << EOF >> $GITHUB_STEP_SUMMARY
          ## ⚠️ Debug APK Built (Release Publishing Notice)

          - **APK Build Status**: ✅ Succeeded
          - **GitHub Actions Artifact**: ✅ **\`app-debug-apk\`** is uploaded and available for download at the bottom of this workflow run page.
          - **Release Publishing**: ⚠️ Could not create or publish GitHub Release automatically. Please download the APK from the workflow summary artifacts.
          EOF
          fi
